  const d = new Date();
  const year = d.getFullYear();

  const day = String(d.getDate()).padStart(2, '0');
  return `${year}-${month}-${day}`;
};

  const d = new Date();

  const month = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${year}-${month}-${day}`;
};

// --------------------------------------------------------------------------
// Helper: Format friendly date
// --------------------------------------------------------------------------
function formatFriendlyDate(dateStr) {
  if (!dateStr) return "";
  const parts = dateStr.split('-');
  if (parts.length !== 3) return dateStr;
  const d = new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2]));
  return d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
}

// --------------------------------------------------------------------------
// Helper: Calculate attendance stats for a student
// --------------------------------------------------------------------------
function calculateStudentStats(studentId, attendanceData) {
  let presentDays = 0;
  let absentDays = 0;

  Object.keys(attendanceData).forEach((dateKey) => {
    const dayRecord = attendanceData[dateKey];
    if (dayRecord && dayRecord[studentId]) {
      const status = typeof dayRecord[studentId] === 'object' ? dayRecord[studentId].status : dayRecord[studentId];
      if (status === 'Present') presentDays++;
      else if (status === 'Absent') absentDays++;
    }
  });

  const totalRecorded = presentDays + absentDays;
  const percentage = totalRecorded > 0 ? ((presentDays / totalRecorded) * 100).toFixed(1) : "0.0";

  let statusCategory = "Excellent";
  let statusColor = "fill-excellent";
  const numPercent = parseFloat(percentage);

  if (totalRecorded === 0) {
    statusCategory = "No Records";
    statusColor = "fill-good";
  } else if (numPercent >= 85) {
    statusCategory = "Excellent";
    statusColor = "fill-excellent";
  } else if (numPercent >= 75) {
    statusCategory = "Good";
    statusColor = "fill-good";
  } else if (numPercent >= 65) {
    statusCategory = "Warning";
    statusColor = "fill-warning";
  } else {
    statusCategory = "Critical";
    statusColor = "fill-danger";
  }

  return {
    totalRecorded,
    presentDays,
    absentDays,
    percentage: parseFloat(percentage),
    statusCategory,
    statusColor
  };
}

function Dashboard({ students, attendanceData, setCurrentTab, onOpenAddStudent }) {
  const todayStr = getTodayDateString();
  const todayRecords = attendanceData[todayStr] || {};

  // Calculate today's stats
  const totalStudents = students.length;
  let presentToday = 0;
  let absentToday = 0;

  students.forEach((std) => {
    const record = todayRecords[std.id];
    const status = typeof record === 'object' ? record?.status : record;
    if (status === 'Present') presentToday++;
    else if (status === 'Absent') absentToday++;
  });

  const markedToday = presentToday + absentToday;
  const attendanceRateToday = markedToday > 0 ? ((presentToday / markedToday) * 100).toFixed(1) : "0.0";

  // Calculate class-wise stats
  const classBreakdown = useMemo(() => {
    const map = {};
    students.forEach((std) => {
      const cls = std.grade || "Unassigned";
      if (!map[cls]) {
        map[cls] = { total: 0, present: 0, absent: 0 };
      }
      map[cls].total++;
      const record = todayRecords[std.id];
      const status = typeof record === 'object' ? record?.status : record;
      if (status === 'Present') map[cls].present++;
      else if (status === 'Absent') map[cls].absent++;
    });

    return Object.keys(map).map((clsName) => {
      const data = map[clsName];
      const marked = data.present + data.absent;
      const rate = marked > 0 ? Math.round((data.present / marked) * 100) : 0;
      return {
        className: clsName,
        total: data.total,
        present: data.present,
        absent: data.absent,
        rate
      };
    });
  }, [students, todayRecords]);

  // Students with low overall attendance (< 75%)
  const lowAttendanceStudents = useMemo(() => {
    return students
      .map((std) => {
        const stats = calculateStudentStats(std.id, attendanceData);
        return { ...std, stats };
      })
      .filter((std) => std.stats.totalRecorded > 0 && std.stats.percentage < 75)
      .sort((a, b) => a.stats.percentage - b.stats.percentage);
  }, [students, attendanceData]);

  // Recent attendance history for past 5 dates
  const recentDays = useMemo(() => {
    const dates = Object.keys(attendanceData)
      .sort((a, b) => b.localeCompare(a))
      .slice(0, 5);

    return dates.map((dateKey) => {
      const dayRec = attendanceData[dateKey] || {};
      let pCount = 0;
      let aCount = 0;
      students.forEach((std) => {
        const rec = dayRec[std.id];
        const status = typeof rec === 'object' ? rec?.status : rec;
        if (status === 'Present') pCount++;
        else if (status === 'Absent') aCount++;
      });
      const total = pCount + aCount;
      const rate = total > 0 ? ((pCount / total) * 100).toFixed(0) : "0";
      return {
        date: dateKey,
        friendlyDate: formatFriendlyDate(dateKey),
        present: pCount,
        absent: aCount,
        rate
      };
    });
  }, [attendanceData, students]);

  return (
    <div className="dashboard-content">
      {/* Welcome Banner */}
      <div className="dashboard-welcome">
        <div className="welcome-text">
          <h3>Welcome to AttendTrack Portal 👋</h3>
          <p>
            Track daily classroom attendance, monitor student consistency, and generate detailed percentage reports with ease.
          </p>
        </div>
        <div className="welcome-actions">
          <button className="btn-welcome-light" onClick={() => setCurrentTab('attendance')}>
            <Icons.Check />
            <span>Mark Today's Attendance</span>
          </button>
          <button className="btn-welcome-outline" onClick={onOpenAddStudent}>
            <Icons.Plus />
            <span>Add Student</span>
          </button>
        </div>
      </div>

      {/* 4 Metric Cards */}
      <div className="metrics-grid">
        <div className="metric-card">
          <div className="metric-info">
            <span className="metric-label">Total Students</span>
            <span className="metric-value">{totalStudents}</span>
            <span className="metric-sub">
              <span>Enrolled in directory</span>
            </span>
          </div>
          <div className="metric-icon-box icon-blue">
            <Icons.Students />
          </div>
        </div>

        <div className="metric-card">
          <div className="metric-info">
            <span className="metric-label">Present Today</span>
            <span className="metric-value" style={{ color: 'var(--success)' }}>{presentToday}</span>
            <span className="metric-sub">
              <span style={{ color: 'var(--success)', fontWeight: 600 }}>Active in classes</span>
            </span>
          </div>
          <div className="metric-icon-box icon-green">
            <Icons.UserCheck />
          </div>
        </div>

        <div className="metric-card">
          <div className="metric-info">
            <span className="metric-label">Absent Today</span>
            <span className="metric-value" style={{ color: 'var(--danger)' }}>{absentToday}</span>
            <span className="metric-sub">
              <span style={{ color: 'var(--danger)', fontWeight: 600 }}>Marked absent</span>
            </span>
          </div>
          <div className="metric-icon-box icon-red">
            <Icons.UserX />
          </div>
        </div>

        <div className="metric-card">
          <div className="metric-info">
            <span className="metric-label">Attendance Rate</span>
            <span className="metric-value">{attendanceRateToday}%</span>
            <span className="metric-sub">
              <span>Today's ratio ({presentToday}/{markedToday || totalStudents})</span>
            </span>
          </div>
          <div className="metric-icon-box icon-purple">
            <Icons.TrendingUp />
          </div>
        </div>
      </div>

      {/* Middle Two-Column Grid */}
      <div className="dashboard-grid-two-col">
        {/* Visual Ratio & Class Stats */}
        <div className="card">
          <div className="card-header">
            <div className="card-title-group">
              <h4>Today's Attendance Overview</h4>
              <p>Visual status distribution for {formatFriendlyDate(todayStr)}</p>
            </div>
            <button className="btn-secondary" style={{ padding: '6px 12px', fontSize: '0.8rem' }} onClick={() => setCurrentTab('attendance')}>
              View Sheet
            </button>
          </div>
          <div className="card-body">
            <div className="visual-progress-section">
              <div className="progress-bar-container">
                <div 
                  className="progress-bar-fill-present"
                  style={{ width: `${Math.max(parseFloat(attendanceRateToday), 5)}%` }}
                >
                  {attendanceRateToday}%
                </div>
              </div>
              <div className="progress-legend">
                <div className="legend-item">
                  <span className="legend-color-dot dot-green"></span>
                  <span>Present: {presentToday} students</span>
                </div>
                <div className="legend-item">
                  <span className="legend-color-dot dot-red"></span>
                  <span>Absent: {absentToday} students</span>
                </div>
              </div>
            </div>

            <div style={{ marginTop: '24px' }}>
              <h5 style={{ fontSize: '0.9rem', fontWeight: 700, marginBottom: '12px', color: 'var(--text-main)' }}>
                Class Breakdown
              </h5>
              <div className="class-stat-list">
                {classBreakdown.map((item) => (
                  <div key={item.className} className="class-stat-row">
                    <div>
                      <div className="class-stat-name">{item.className}</div>
                      <div className="class-stat-count">{item.present} Present / {item.absent} Absent ({item.total} total)</div>
                    </div>
                    <span className={`class-rate-badge ${item.rate >= 80 ? 'rate-high' : item.rate >= 70 ? 'rate-medium' : 'rate-low'}`}>
                      {item.rate}% Present
                    </span>
                  </div>
                ))}
              </div>

        </div>

        {/* Low Attendance Alert Card */}
        <div className="card">
          <div className="card-header">
            <div className="card-title-group">
              <h4 style={{ display: 'flex', alignItems: 'center', gap: '8px' }}>
                <span style={{ color: 'var(--danger)' }}><Icons.AlertTriangle /></span>
                <span>Low Attendance Alert</span>
              </h4>
              <p>Students with overall rate below 75%</p>
            </div>
          </div>
          <div className="card-body">
            {lowAttendanceStudents.length === 0 ? (
              <div style={{ textAlign: 'center', padding: '24px 10px', color: 'var(--success)' }}>
                <Icons.Check />
                <p style={{ marginTop: '8px', fontSize: '0.9rem', fontWeight: 600 }}>All students are above 75% attendance!</p>
                <p style={{ fontSize: '0.8rem', color: 'var(--text-muted)' }}>Great consistency across classes.</p>
              </div>
            ) : (
              <div className="alert-student-list">
                {lowAttendanceStudents.map((std) => (
                  <div key={std.id} className="alert-student-item">
                    <div className="alert-student-info">
                      <div className="alert-student-avatar">
                        {std.name.charAt(0)}
                      </div>
                      <div>
                        <div className="alert-student-name">{std.name}</div>
                        <div className="alert-student-meta">Roll #{std.rollNumber} • {std.grade}</div>
                      </div>
                    </div>
                    <div className="alert-rate-tag">
                      {std.stats.percentage}%
                    </div>
                  </div>
                ))}

            )}

            <button

      {/* Recent Activity Log */}
      <div className="card">
        <div className="card-header">
          <div className="card-title-group">

          </div>
          <button className="btn-secondary" style={{ padding: '6px 12px', fontSize: '0.8rem' }} onClick={() => setCurrentTab('attendance')}>

          </button>
        </div>
        <div className="table-responsive">
          <table className="data-table">
            <thead>
              <tr>
                <th>Date</th>
                <th>Present Count</th>
                <th>Absent Count</th>
                <th>Overall Rate</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody>
              {recentDays.map((row) => (
                <tr key={row.date}>

  );
}

function Attendance({ students, attendanceData, onSaveAttendance, showToast }) {
  const [selectedDate, setSelectedDate] = useState(getTodayDateString());
  const [selectedClass, setSelectedClass] = useState("ALL");
  const [searchTerm, setSearchTerm] = useState("");

  // Get current day records from props
  const dateRecord = attendanceData[selectedDate] || {};

  // Get unique classes
  const classes = useMemo(() => {
    const list = Array.from(new Set(students.map((s) => s.grade || "Unassigned")));
    list.sort();
    return list;
  }, [students]);

  // Filter students for the table
  const displayedStudents = useMemo(() => {
    return students.filter((std) => {
      const matchSearch =
        std.name.toLowerCase().includes(searchTerm.toLowerCase()) ||
        std.rollNumber.toLowerCase().includes(searchTerm.toLowerCase());
      const matchClass = selectedClass === "ALL" || std.grade === selectedClass;
      return matchSearch && matchClass;
    });
  }, [students, searchTerm, selectedClass]);

  // Stats for the chosen date
  const dateStats = useMemo(() => {
    let present = 0;
    let absent = 0;
    let unmarked = 0;

    students.forEach((std) => {
      const rec = dateRecord[std.id];
      const status = typeof rec === 'object' ? rec?.status : rec;
      if (status === 'Present') present++;
      else if (status === 'Absent') absent++;
      else unmarked++;
    });

    const total = students.length;
    const marked = present + absent;
    const rate = marked > 0 ? ((present / marked) * 100).toFixed(1) : "0.0";

    return { total, present, absent, unmarked, rate };
  }, [students, dateRecord]);

  // Handle single student status toggle
  const handleToggleStatus = (studentId, newStatus) => {
    const existing = dateRecord[studentId];
    const oldRemark = typeof existing === 'object' ? existing?.remark || "" : "";

    const updatedDateRecords = {
      ...dateRecord,
      [studentId]: {
        status: newStatus,
        remark: oldRemark
      }
    };

    onSaveAttendance(selectedDate, updatedDateRecords);
  };

  // Handle remark change
  const handleRemarkChange = (studentId, remarkText) => {
    const existing = dateRecord[studentId];
    const currentStatus = typeof existing === 'object' ? existing?.status : existing || 'Present';

    const updatedDateRecords = {
      ...dateRecord,
      [studentId]: {
        status: currentStatus,
        remark: remarkText
      }
    };

    onSaveAttendance(selectedDate, updatedDateRecords);
  };

  // Bulk: Mark All Present
  const handleMarkAllPresent = () => {
    const updated = { ...dateRecord };
    displayedStudents.forEach((std) => {
      const existing = updated[std.id];
      const remark = typeof existing === 'object' ? existing?.remark || "" : "";
      updated[std.id] = { status: "Present", remark };
    });
    onSaveAttendance(selectedDate, updated);
    showToast(`Marked ${displayedStudents.length} students Present for ${selectedDate}`, 'success');
  };

  // Bulk: Mark All Absent
  const handleMarkAllAbsent = () => {
    const updated = { ...dateRecord };
    displayedStudents.forEach((std) => {
      const existing = updated[std.id];
      const remark = typeof existing === 'object' ? existing?.remark || "" : "";
      updated[std.id] = { status: "Absent", remark };
    });
    onSaveAttendance(selectedDate, updated);
    showToast(`Marked ${displayedStudents.length} students Absent for ${selectedDate}`, 'danger');
  };

  // Date steppers
  const handleStepDay = (step) => {
    const parts = selectedDate.split('-');
    const cur = new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2]));
    cur.setDate(cur.getDate() + step);
    const yr = cur.getFullYear();
    const mo = String(cur.getMonth() + 1).padStart(2, '0');
    const da = String(cur.getDate()).padStart(2, '0');
    setSelectedDate(`${yr}-${mo}-${da}`);
  };

  return (
    <div className="attendance-content">
      {/* Date Control Panel */}
      <div className="attendance-control-panel">
        <div className="attendance-date-row">
          <div className="date-picker-group">
            <span className="date-label">Attendance Date:</span>
            <input
              type="date"
              className="date-input"
              value={selectedDate}
              onChange={(e) => setSelectedDate(e.target.value)}
            />
            <button 
              className={`btn-date-nav ${selectedDate === getTodayDateString() ? 'active' : ''}`}
              onClick={() => setSelectedDate(getTodayDateString())}
            >
              Today
            </button>
            <button 
              className="btn-date-nav"
              onClick={() => handleStepDay(-1)}
              title="Previous Day"
            >
              ◀ Prev
            </button>
            <button 
              className="btn-date-nav"
              onClick={() => handleStepDay(1)}
              title="Next Day"
            >
              Next ▶
            </button>
            <span style={{ fontWeight: 600, color: 'var(--text-main)', marginLeft: '6px' }}>
              {formatFriendlyDate(selectedDate)}
            </span>
          </div>

          <div className="bulk-actions-group">
            <button className="btn-bulk-present" onClick={handleMarkAllPresent}>
              <Icons.Check />
              <span>Mark All Present</span>
            </button>
            <button className="btn-bulk-absent" onClick={handleMarkAllAbsent}>
              <Icons.X />
              <span>Mark All Absent</span>
            </button>
          </div>
        </div>

        {/* Date Statistics Bar */}
        <div className="attendance-summary-bar">
          <div className="summary-stat-box">
            <span className="summary-stat-label">Total Students</span>
            <span className="summary-stat-val">{dateStats.total}</span>
          </div>
          <div className="summary-stat-box">
            <span className="summary-stat-label">Present</span>
            <span className="summary-stat-val val-green">{dateStats.present}</span>
          </div>
          <div className="summary-stat-box">
            <span className="summary-stat-label">Absent</span>
            <span className="summary-stat-val val-red">{dateStats.absent}</span>
          </div>
          <div className="summary-stat-box">
            <span className="summary-stat-label">Attendance Rate</span>
            <span className="summary-stat-val val-purple">{dateStats.rate}%</span>
          </div>
        </div>
      </div>

      {/* Filters */}
      <div className="page-toolbar">
        <div className="search-filter-group">
          <div className="search-box">
            <span className="search-icon-inside"><Icons.Search /></span>
            <input
              type="text"
              placeholder="Filter student list..."
              className="search-input"
              value={searchTerm}
              onChange={(e) => setSearchTerm(e.target.value)}
            />
          </div>

          <select
            className="filter-select"
            value={selectedClass}
            onChange={(e) => setSelectedClass(e.target.value)}
          >
            <option value="ALL">All Classes</option>
            {classes.map((cls) => (

        <div style={{ fontSize: '0.85rem', color: 'var(--text-muted)' }}>

      </div>

      {/* Attendance Sheet Table */}
      <div className="attendance-table-container">

          <thead>
            <tr>
              <th>Student</th>
              <th>Roll No</th>
              <th>Class</th>
              <th>Mark Attendance</th>
              <th>Remark / Notes (Optional)</th>
            </tr>
          </thead>
          <tbody>
            {displayedStudents.map((std) => {
              const record = dateRecord[std.id];
              const status = typeof record === 'object' ? record?.status : record;
              const remark = typeof record === 'object' ? record?.remark || "" : "";

              return (
                <tr key={std.id}>
                  <td>
                    <div className="student-meta-cell">
                      <div className="student-avatar">{std.name.charAt(0)}</div>
                      <span className="student-name-text">{std.name}</span>
                    </div>
                  </td>
                  <td>
                    <strong>#{std.rollNumber}</strong>
                  </td>
                  <td>
                    <span className="badge badge-class">{std.grade}</span>
                  </td>
                  <td>
                    <div className="attendance-toggle-group">
                      <button

                      </button>
                      <button
                        className={`btn-toggle-status ${status === 'Absent' ? 'active-absent' : ''}`}
                        onClick={() => handleToggleStatus(std.id, 'Absent')}
                      >
                        <Icons.X />
                        <span>Absent</span>
                      </button>
                    </div>
                  </td>
                  <td>
                    <input
                      type="text"
                      className="notes-input"
                      placeholder="e.g. Fever, Sports..."
                      value={remark}
                      onChange={(e) => handleRemarkChange(std.id, e.target.value)}
                    />
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
    </div>
  );
}

function Reports({ students, attendanceData, onViewStudent }) {
  const [searchTerm, setSearchTerm] = useState("");
  const [selectedClass, setSelectedClass] = useState("ALL");
  const [statusFilter, setStatusFilter] = useState("ALL");

  // Calculate statistics for each student
  const studentReports = useMemo(() => {
    return students.map((std) => {
      const stats = calculateStudentStats(std.id, attendanceData);
      return {
        ...std,
        ...stats
      };
    });
  }, [students, attendanceData]);

  // Overall aggregate metrics
  const aggregateMetrics = useMemo(() => {
    let totalPercents = 0;
    let studentsCount = 0;
    let highCount = 0;
    let lowCount = 0;

    studentReports.forEach((s) => {
      if (s.totalRecorded > 0) {
        totalPercents += s.percentage;
        studentsCount++;
        if (s.percentage >= 85) highCount++;
        else if (s.percentage < 75) lowCount++;
      }
    });

    const averageRate = studentsCount > 0 ? (totalPercents / studentsCount).toFixed(1) : "0.0";
    return { averageRate, highCount, lowCount, totalStudents: students.length };
  }, [studentReports, students]);

  // Filter list
  const filteredReports = useMemo(() => {
    return studentReports.filter((item) => {
      const matchSearch =
        item.name.toLowerCase().includes(searchTerm.toLowerCase()) ||
        item.rollNumber.toLowerCase().includes(searchTerm.toLowerCase());
      const matchClass = selectedClass === "ALL" || item.grade === selectedClass;
      let matchStatus = true;
      if (statusFilter === "EXCELLENT") matchStatus = item.percentage >= 85;
      else if (statusFilter === "GOOD") matchStatus = item.percentage >= 75 && item.percentage < 85;
      else if (statusFilter === "WARNING") matchStatus = item.percentage < 75;

      return matchSearch && matchClass && matchStatus;
    });
  }, [studentReports, searchTerm, selectedClass, statusFilter]);

  // Classes list
  const classes = useMemo(() => {
    const list = Array.from(new Set(students.map((s) => s.grade || "Unassigned")));
    list.sort();
    return list;
  }, [students]);

  // CSV Export feature
  const exportToCSV = () => {
    const headers = ["Roll Number", "Student Name", "Class", "Total Recorded Days", "Days Present", "Days Absent", "Attendance %", "Status"];
    const rows = filteredReports.map((r) => [
      r.rollNumber,
      `"${r.name}"`,
      `"${r.grade}"`,
      r.totalRecorded,
      r.presentDays,
      r.absentDays,
      `${r.percentage}%`,
      r.statusCategory
    ]);

    const csvContent = [headers.join(","), ...rows.map((e) => e.join(","))].join("\n");
    const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.setAttribute("href", url);
    link.setAttribute("download", `Attendance_Report_${getTodayDateString()}.csv`);
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  };

  // Print Report feature
  const handlePrint = () => {
    window.print();
  };

  return (
    <div className="reports-content">
      {/* 3 Summary Cards */}
      <div className="report-overview-cards">
        <div className="report-summary-card">
          <div className="report-summary-icon icon-blue">
            <Icons.TrendingUp />
          </div>
          <div>
            <div style={{ fontSize: '0.8rem', color: 'var(--text-muted)', fontWeight: 600 }}>CLASSROOM AVERAGE</div>
            <div style={{ fontSize: '1.75rem', fontWeight: 800 }}>{aggregateMetrics.averageRate}%</div>
            <div style={{ fontSize: '0.78rem', color: 'var(--text-muted)' }}>Across all recorded sessions</div>
          </div>
        </div>

        <div className="report-summary-card">
          <div className="report-summary-icon icon-green">
            <Icons.UserCheck />
          </div>
          <div>
            <div style={{ fontSize: '0.8rem', color: 'var(--text-muted)', fontWeight: 600 }}>EXCELLENT (≥85%)</div>
            <div style={{ fontSize: '1.75rem', fontWeight: 800, color: 'var(--success)' }}>{aggregateMetrics.highCount}</div>
            <div style={{ fontSize: '0.78rem', color: 'var(--text-muted)' }}>High consistency students</div>
          </div>
        </div>

        <div className="report-summary-card">
          <div className="report-summary-icon icon-red">
            <Icons.AlertTriangle />
          </div>
          <div>
            <div style={{ fontSize: '0.8rem', color: 'var(--text-muted)', fontWeight: 600 }}>NEEDS ATTENTION (&lt;75%)</div>
            <div style={{ fontSize: '1.75rem', fontWeight: 800, color: 'var(--danger)' }}>{aggregateMetrics.lowCount}</div>
            <div style={{ fontSize: '0.78rem', color: 'var(--text-muted)' }}>Below attendance threshold</div>
          </div>
        </div>
      </div>

      {/* Toolbar Filters & Export Buttons */}
      <div className="page-toolbar">
        <div className="search-filter-group">
          <div className="search-box">
            <span className="search-icon-inside"><Icons.Search /></span>
            <input
              type="text"
              placeholder="Search reports by student name, roll #..."
              className="search-input"
              value={searchTerm}
              onChange={(e) => setSearchTerm(e.target.value)}
            />
          </div>

          <select
            className="filter-select"
            value={selectedClass}
            onChange={(e) => setSelectedClass(e.target.value)}
          >
            <option value="ALL">All Classes</option>
            {classes.map((c) => (
              <option key={c} value={c}>{c}</option>
            ))}
          </select>

          <select
            className="filter-select"
            value={statusFilter}
            onChange={(e) => setStatusFilter(e.target.value)}
          >
            <option value="ALL">All Categories</option>
            <option value="EXCELLENT">Excellent (≥85%)</option>
            <option value="GOOD">Good (75%-84%)</option>
            <option value="WARNING">Needs Attention (&lt;75%)</option>
          </select>
        </div>

        <div className="toolbar-actions">
          <button className="btn-secondary" onClick={exportToCSV}>
            <Icons.Download />
            <span>Export CSV</span>
          </button>
          <button className="btn-secondary" onClick={handlePrint}>
            <Icons.Printer />
            <span>Print Report</span>
          </button>
        </div>
      </div>

      {/* Detailed Reports Table */}
      <div className="table-responsive">
        <table className="data-table">
          <thead>
            <tr>
              <th>Roll #</th>
              <th>Student Name</th>
              <th>Class</th>
              <th>Working Days</th>
              <th>Days Present</th>
              <th>Days Absent</th>
              <th>Attendance %</th>
              <th>Status Category</th>
              <th style={{ textAlign: 'right' }}>Action</th>
            </tr>
          </thead>
          <tbody>
            {filteredReports.map((item) => (
              <tr key={item.id}>
                <td><strong>#{item.rollNumber}</strong></td>
                <td>
                  <div className="student-meta-cell">
                    <div className="student-avatar">{item.name.charAt(0)}</div>
                    <span className="student-name-text">{item.name}</span>
                  </div>
                </td>
                <td><span className="badge badge-class">{item.grade}</span></td>
                <td>{item.totalRecorded} days</td>
                <td><strong style={{ color: 'var(--success)' }}>{item.presentDays}</strong></td>
                <td><strong style={{ color: 'var(--danger)' }}>{item.absentDays}</strong></td>
                <td>
                  <div className="report-table-progress">
                    <div className="table-progress-bar">
                      <div
                        className={`table-progress-fill ${item.statusColor}`}
                        style={{ width: `${Math.max(item.percentage, 5)}%` }}
                      />
                    </div>
                    <span className="percentage-text">{item.percentage}%</span>
                  </div>
                </td>
                <td>
                  <span className={`class-rate-badge ${item.percentage >= 85 ? 'rate-high' : item.percentage >= 75 ? 'rate-medium' : 'rate-low'}`}>
                    {item.statusCategory}
                  </span>
                </td>
                <td style={{ textAlign: 'right' }}>
                  <button 
                    className="btn-icon-action"
                    onClick={() => onViewStudent(item)}
                    title="View Log History"
                  >
                    <Icons.Eye />
                  </button>
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

function StudentModal({ isOpen, onClose, onSave, studentToEdit, existingStudents }) {
  if (!isOpen) return null;

  const isEdit = Boolean(studentToEdit);
  const [name, setName] = useState(studentToEdit?.name || "");
  const [rollNumber, setRollNumber] = useState(studentToEdit?.rollNumber || "");
  const [grade, setGrade] = useState(studentToEdit?.grade || "Class 10-A");
  const [gender, setGender] = useState(studentToEdit?.gender || "Male");
  const [email, setEmail] = useState(studentToEdit?.email || "");
  const [phone, setPhone] = useState(studentToEdit?.phone || "");
  const [error, setError] = useState("");

  const handleSubmit = (e) => {
    e.preventDefault();
    setError("");

    if (!name.trim()) {
      setError("Please enter the student's full name.");
      return;
    }
    if (!rollNumber.trim()) {
      setError("Please enter a valid roll number.");
      return;
    }

    // Check roll number uniqueness
    const duplicate = existingStudents.find(
      (s) => s.rollNumber.trim().toLowerCase() === rollNumber.trim().toLowerCase() && s.id !== studentToEdit?.id
    );
    if (duplicate) {
      setError(`Roll number #${rollNumber} is already assigned to ${duplicate.name}.`);
      return;
    }

    const payload = {
      id: studentToEdit?.id || `std-${Date.now()}`,
      name: name.trim(),
      rollNumber: rollNumber.trim(),
      grade: grade.trim(),
      gender,
      email: email.trim(),
      phone: phone.trim()
    };

    onSave(payload);
    onClose();
  };

  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal-card" onClick={(e) => e.stopPropagation()}>
        <div className="modal-header">
          <h3>{isEdit ? "Edit Student Details" : "Add New Student"}</h3>
          <button className="btn-modal-close" onClick={onClose}>
            <Icons.X />
          </button>
        </div>

        <form onSubmit={handleSubmit} className="modal-form">
          {error && <div className="form-error-text" style={{ padding: '8px 12px', backgroundColor: '#fee2e2', borderRadius: '6px' }}>{error}</div>}

          <div className="form-row-two">
            <div className="form-group">
              <label className="form-label">Full Name *</label>
              <input
                type="text"
                className="form-input"
                placeholder="e.g. Rahul Sharma"
                value={name}
                onChange={(e) => setName(e.target.value)}
                autoFocus
              />
            </div>

            <div className="form-group">
              <label className="form-label">Roll Number *</label>
              <input
                type="text"
                className="form-input"
                placeholder="e.g. 106"
                value={rollNumber}
                onChange={(e) => setRollNumber(e.target.value)}
              />
            </div>
          </div>

          <div className="form-row-two">
            <div className="form-group">
              <label className="form-label">Class / Section</label>
              <input
                type="text"
                className="form-input"
                placeholder="e.g. Class 10-A"
                value={grade}
                onChange={(e) => setGrade(e.target.value)}
              />
            </div>

            <div className="form-group">
              <label className="form-label">Gender</label>
              <select className="form-select" value={gender} onChange={(e) => setGender(e.target.value)}>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
                <option value="Other">Other</option>
              </select>
            </div>
          </div>

          <div className="form-group">
            <label className="form-label">Email Address (Optional)</label>
            <input
              type="email"
              className="form-input"
              placeholder="e.g. rahul@example.com"
              value={email}
              onChange={(e) => setEmail(e.target.value)}
            />
          </div>

          <div className="form-group">
            <label className="form-label">Guardian Phone Number (Optional)</label>
            <input
              type="text"
              className="form-input"
              placeholder="e.g. +91 98765 00000"
              value={phone}
              onChange={(e) => setPhone(e.target.value)}
            />
          </div>

          <div className="modal-footer" style={{ margin: '16px -24px -24px -24px' }}>
            <button type="button" className="btn-secondary" onClick={onClose}>
              Cancel
            </button>
            <button type="submit" className="btn-primary">
              <Icons.Check />
              <span>{isEdit ? "Save Changes" : "Create Student"}</span>
            </button>
          </div>
        </form>
      </div>
    </div>
  );
}

// ==========================================================================
// Main Root Application
// ==========================================================================
function App() {
  const [currentTab, setCurrentTab] = useState("dashboard");
  const [mobileOpen, setMobileOpen] = useState(false);

  // Student list state initialized from localStorage
  const [students, setStudents] = useState(() => {
    try {
      const saved = localStorage.getItem(STORAGE_KEYS.STUDENTS);
      if (saved) return JSON.parse(saved);
    } catch (e) {
      console.error("Failed to load students from localStorage", e);
    }
    return SAMPLE_STUDENTS;
  });

  // Attendance records state initialized from localStorage
  const [attendanceData, setAttendanceData] = useState(() => {
    try {
      const saved = localStorage.getItem(STORAGE_KEYS.ATTENDANCE);
      if (saved) return JSON.parse(saved);
    } catch (e) {
      console.error("Failed to load attendance from localStorage", e);
    }
    return GENERATE_SAMPLE_ATTENDANCE();
  });

  // Modals state
  const [isAddEditModalOpen, setIsAddEditModalOpen] = useState(false);
  const [studentToEdit, setStudentToEdit] = useState(null);
  const [studentToDelete, setStudentToDelete] = useState(null);
  const [studentToView, setStudentToView] = useState(null);

  // Toast notifications state
  const [toasts, setToasts] = useState([]);

  const showToast = useCallback((message, type = "info") => {
    const id = Date.now() + Math.random();
    setToasts((prev) => [...prev, { id, message, type }]);
    setTimeout(() => {
      setToasts((prev) => prev.filter((t) => t.id !== id));
    }, 3200);
  }, []);

  const removeToast = useCallback((id) => {
    setToasts((prev) => prev.filter((t) => t.id !== id));
  }, []);

  // Save students to localStorage whenever state changes
  useEffect(() => {
    try {
      localStorage.setItem(STORAGE_KEYS.STUDENTS, JSON.stringify(students));
    } catch (e) {
      console.error("Error saving students to localStorage", e);
    }
  }, [students]);

  // Save attendance to localStorage whenever state changes
  useEffect(() => {
    try {
      localStorage.setItem(STORAGE_KEYS.ATTENDANCE, JSON.stringify(attendanceData));
    } catch (e) {
      console.error("Error saving attendance to localStorage", e);
    }
  }, [attendanceData]);

  // Add or Update student handler
  const handleSaveStudent = (studentData) => {
    if (studentToEdit) {
      // Edit existing
      setStudents((prev) => prev.map((s) => (s.id === studentData.id ? studentData : s)));
      showToast(`Updated profile for ${studentData.name}`, 'success');
    } else {
      // Add new
      setStudents((prev) => [studentData, ...prev]);
      showToast(`Added new student: ${studentData.name}`, 'success');
    }
    setStudentToEdit(null);
  };

  // Delete student handler
  const handleConfirmDelete = () => {
    if (!studentToDelete) return;
    const name = studentToDelete.name;
    setStudents((prev) => prev.filter((s) => s.id !== studentToDelete.id));
    setStudentToDelete(null);
    showToast(`Removed student ${name} from roster`, 'danger');
  };

  // Save single date attendance records
  const handleSaveAttendance = (dateKey, updatedDateRecords) => {
    setAttendanceData((prev) => ({
      ...prev,
      [dateKey]: updatedDateRecords
    }));
  };

  // Reset to initial demo data
  const handleResetDemo = () => {
    if (window.confirm("Reset all data to default demo students and sample attendance records?")) {
      setStudents(SAMPLE_STUDENTS);
      setAttendanceData(GENERATE_SAMPLE_ATTENDANCE());
      showToast("Restored demo students and sample attendance history!", "info");
    }
  };

  return (
    <div className="app-container">
      {/* Toast Notifications */}
      <ToastContainer toasts={toasts} removeToast={removeToast} />

      {/* Sidebar Navigation */}
      <Sidebar
        currentTab={currentTab}
        setCurrentTab={setCurrentTab}
        studentCount={students.length}
        mobileOpen={mobileOpen}
        setMobileOpen={setMobileOpen}
        onResetDemo={handleResetDemo}
      />

      {/* Main Content Area */}
      <div className="main-wrapper">
        <Header
          currentTab={currentTab}
          setCurrentTab={setCurrentTab}
          setMobileOpen={setMobileOpen}
          onOpenAddStudent={() => {
            setStudentToEdit(null);
            setIsAddEditModalOpen(true);
          }}
        />

        <main className="content-body">
          {currentTab === 'dashboard' && (
            <Dashboard
              students={students}
              attendanceData={attendanceData}
              setCurrentTab={setCurrentTab}
              onOpenAddStudent={() => {
                setStudentToEdit(null);
                setIsAddEditModalOpen(true);
              }}
            />
          )}

          {currentTab === 'students' && (
            <Students
              students={students}
              attendanceData={attendanceData}
              onAddStudent={() => {
                setStudentToEdit(null);
                setIsAddEditModalOpen(true);
              }}
              onEditStudent={(std) => {
                setStudentToEdit(std);
                setIsAddEditModalOpen(true);
              }}
              onDeleteStudent={(std) => setStudentToDelete(std)}
              onViewStudent={(std) => setStudentToView(std)}
            />
          )}

          {currentTab === 'attendance' && (
            <Attendance
              students={students}
              attendanceData={attendanceData}
              onSaveAttendance={handleSaveAttendance}
              showToast={showToast}
            />
          )}

          {currentTab === 'reports' && (
            <Reports
              students={students}
              attendanceData={attendanceData}
              onViewStudent={(std) => setStudentToView(std)}
            />
          )}
        </main>
      </div>

      {/* Add / Edit Student Modal */}
      <StudentModal
        isOpen={isAddEditModalOpen}
        studentToEdit={studentToEdit}
        existingStudents={students}
        onClose={() => {
          setIsAddEditModalOpen(false);
          setStudentToEdit(null);
        }}
        onSave={handleSaveStudent}
      />

      {/* Student Details / Profile View Modal */}
      <StudentDetailsModal
        student={studentToView}
        attendanceData={attendanceData}
        onClose={() => setStudentToView(null)}
      />

      {/* Delete Confirmation Modal */}
      <DeleteConfirmModal
        student={studentToDelete}
        onConfirm={handleConfirmDelete}
        onCancel={() => setStudentToDelete(null)}
      />
    </div>
  );
}

// --------------------------------------------------------------------------
// Mount React 18 Application
// --------------------------------------------------------------------------
const rootElement = document.getElementById("root");
if (rootElement) {
  const root = ReactDOM.createRoot(rootElement);
  root.render(<App />);
}
  </script>
</body>
</html>
